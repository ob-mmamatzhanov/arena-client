<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Arena</title>
  <style>
    body { margin: 0; background: #111; color: #ccc; font: 14px sans-serif;
           display: flex; flex-direction: column; align-items: center; }
    canvas { background: #1e1e24; margin-top: 16px; cursor: none; } /* прицел рисуем сами */
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <p>WASD / стрелки — движение, мышь — прицел, ЛКМ / пробел — огонь, I — интерполяция вкл/выкл</p>

  <script src="net.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    net.attachCanvas(canvas);

    let R = 15; // обновляется из welcome.radius
    const AIM_LEN = 20; // длина линии прицела от центра игрока

    // ---- Визуализация пуль и попаданий ----
    const TRAIL_LEN = 140;     // длина хвоста-трассы, единицы мира
    const GHOST_MS = 220;      // сколько гаснет трасса исчезнувшей пули
    const HIT_MS = 400;        // длительность кольца попадания
    const FLASH_MS = 150;      // вспышка игрока при попадании

    const bullets = new Map(); // id -> {sx, sy, x, y, vx, vy, owner}: sx/sy — точка вылета
    let ghosts = [];           // исчезнувшие пули: {sx, sy, hx, hy, owner, t0}
    let hitFx = [];            // {x, y, killed, t0}
    const flashAt = new Map(); // playerId -> время последнего попадания

    net.onSnapshot = (snap, now) => {
      const dt = 1 / net.welcome.tickRate;
      const seen = new Set();
      for (const b of snap.bullets || []) {
        seen.add(b.id);
        const v = bullets.get(b.id) || { sx: b.x, sy: b.y };
        Object.assign(v, { x: b.x, y: b.y, vx: b.vx, vy: b.vy, owner: b.owner });
        bullets.set(b.id, v);
      }

      // Пули, пропавшие из снапшота, — либо попали, либо истекли/вылетели.
      const gone = [];
      for (const [id, v] of bullets) {
        if (!seen.has(id)) { gone.push(v); bullets.delete(id); }
      }

      for (const h of snap.hits || []) {
        hitFx.push({ x: h.x, y: h.y, killed: h.killed, t0: now });
        flashAt.set(h.target, now);
        // Трасса попавшей пули заканчивается точно в точке попадания.
        let best = null, bestD = Infinity;
        for (const g of gone) {
          if (g.owner !== h.shooter || g.hit) continue;
          const d = Math.hypot(g.x - h.x, g.y - h.y);
          if (d < bestD) { best = g; bestD = d; }
        }
        if (best) { best.hit = true; best.hx = h.x; best.hy = h.y; }
      }

      for (const g of gone) {
        ghosts.push({
          sx: g.sx, sy: g.sy, owner: g.owner, t0: now,
          hx: g.hit ? g.hx : g.x + g.vx * dt,
          hy: g.hit ? g.hy : g.y + g.vy * dt,
        });
      }
    };

    function bulletColor(owner, alpha) {
      const mine = net.welcome && owner === net.welcome.playerId;
      return mine ? `rgba(255,213,74,${alpha})` : `rgba(255,138,80,${alpha})`;
    }

    // Хвост от точки вылета (но не длиннее TRAIL_LEN) до головы, с затуханием к концу.
    function drawTrail(sx, sy, hx, hy, owner, alpha) {
      const dx = hx - sx, dy = hy - sy;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.5) return;
      const k = Math.min(1, TRAIL_LEN / dist);
      const tx = hx - dx * k, ty = hy - dy * k;
      const g = ctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, bulletColor(owner, 0));
      g.addColorStop(1, bulletColor(owner, 0.85 * alpha));
      ctx.strokeStyle = g;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hy);
      ctx.stroke();
    }

    function drawBullets(now) {
      // Между снапшотами двигаем пули по скорости, но не дальше двух тиков.
      const ahead = Math.min((now - (net.latestAt || now)) / 1000, 2 / net.welcome.tickRate);
      for (const v of bullets.values()) {
        const hx = v.x + v.vx * ahead, hy = v.y + v.vy * ahead;
        drawTrail(v.sx, v.sy, hx, hy, v.owner, 1);
        ctx.fillStyle = bulletColor(v.owner, 1);
        ctx.beginPath();
        ctx.arc(hx, hy, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ghosts = ghosts.filter(g => now - g.t0 < GHOST_MS);
      for (const g of ghosts) {
        drawTrail(g.sx, g.sy, g.hx, g.hy, g.owner, 1 - (now - g.t0) / GHOST_MS);
      }
    }

    function drawHits(now) {
      hitFx = hitFx.filter(h => now - h.t0 < HIT_MS);
      for (const h of hitFx) {
        const t = (now - h.t0) / HIT_MS;
        const radius = (h.killed ? 10 + 50 * t : 6 + 26 * t);
        ctx.strokeStyle = h.killed ? `rgba(255,70,70,${1 - t})` : `rgba(255,255,255,${1 - t})`;
        ctx.lineWidth = h.killed ? 4 : 3;
        ctx.beginPath();
        ctx.arc(h.x, h.y, radius, 0, Math.PI * 2);
        ctx.stroke();
        if (h.killed) {
          ctx.fillStyle = `rgba(255,90,90,${1 - t})`;
          ctx.font = "bold 16px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("KILL", h.x, h.y - 20 - 20 * t);
        }
      }
    }

    // ---- Интерполяция других игроков ----
    const RENDER_DELAY = 100;  // мс: рисуем мир с этой задержкой
    let interpOn = true;
    let interpOk = false;      // нашлась ли пара снапшотов вокруг renderTime в этом кадре

    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyI" && !e.repeat) interpOn = !interpOn;
    });

    const lerp = (a, b, t) => a + (b - a) * t;
    // Кратчайший путь по окружности: из 3.1 в -3.1 — это +0.08, а не -6.2.
    function lerpAngle(a, b, t) {
      let d = (b - a) % (2 * Math.PI);
      if (d > Math.PI) d -= 2 * Math.PI;
      if (d < -Math.PI) d += 2 * Math.PI;
      return a + d * t;
    }

    // Игроки для отрисовки: список и hp/score — из последнего снапшота,
    // x/y/angle — интерполированы между снапшотами вокруг now − RENDER_DELAY.
    function renderPlayers(now, latest) {
      interpOk = false;
      if (!interpOn) return latest.players || [];
      const pair = net.bracket(now - RENDER_DELAY);
      if (!pair) return latest.players || []; // снапшотов не хватает — рисуем последний как есть
      interpOk = true;

      const [a, b] = pair;
      const t = b.t > a.t ? (now - RENDER_DELAY - a.t) / (b.t - a.t) : 1;
      const from = new Map((a.snap.players || []).map(p => [p.id, p]));
      const to = new Map((b.snap.players || []).map(p => [p.id, p]));

      return (latest.players || []).map(p => {
        const pa = from.get(p.id), pb = to.get(p.id);
        if (pa && pb) {
          return { ...p, x: lerp(pa.x, pb.x, t), y: lerp(pa.y, pb.y, t), angle: lerpAngle(pa.angle, pb.angle, t) };
        }
        if (pb) return { ...p, x: pb.x, y: pb.y, angle: pb.angle }; // только что появился
        return p; // в момент renderTime ещё не было — показываем последнюю позицию
      });
    }

    // ---- Препятствия ----
    function drawObstacles(wel) {
      ctx.fillStyle = "#55575f";
      ctx.strokeStyle = "#6c6f78";
      ctx.lineWidth = 2;
      for (const o of wel.obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }
    }

    // ---- Прицел с разбросом ----
    // Сервер отклоняет пулю равномерно в ±heat·MAX_SPREAD рад (protocol.go, поле heat).
    // На расстоянии d до курсора это ±d·tan(heat·MAX_SPREAD) — таким и рисуем радиус круга.
    const MAX_SPREAD = 0.25;
    const CROSS_MIN_PX = 6;

    function drawCrosshair(snap, wel, sx, sy) {
      const m = net.mouse();
      if (!m || !net.predictionReady()) return;
      const me = (snap.players || []).find(p => p.id === wel.playerId);
      const heat = me && typeof me.heat === "number" ? Math.min(Math.max(me.heat, 0), 1) : 0;
      const from = net.renderPos();
      const d = Math.hypot(m.x - from.x, m.y - from.y);
      const rPx = Math.max(CROSS_MIN_PX, d * Math.tan(heat * MAX_SPREAD) * (sx + sy) / 2);

      // Рисуем в экранных координатах: мир растянут неравномерно, и круг стал бы эллипсом.
      const cx = m.x * sx, cy = m.y * sy;
      const g = Math.round(255 - 140 * heat), b = Math.round(255 - 215 * heat);
      ctx.strokeStyle = `rgb(255,${g},${b})`; // от белого к оранжево-красному по мере перегрева
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, rPx, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath(); // центр — маленький крест
      ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy);
      ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4);
      ctx.stroke();
    }

    // ---- Раунды ----
    function fmtTime(sec) {
      const s = Math.max(0, Math.ceil(sec));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    function drawRoundTimer(round) {
      ctx.font = "bold 18px monospace";
      ctx.textAlign = "right";
      ctx.fillStyle = round.timeLeft <= 10 ? "#ff6b6b" : "#e8e8e8";
      ctx.fillText(fmtTime(round.timeLeft), canvas.width - 10, 22);
    }

    function drawIntermission(round, snap, wel) {
      ctx.fillStyle = "rgba(10,10,14,0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // scores приходят только в intermission; на всякий случай — запасной вариант из игроков.
      const rows = (round.scores || (snap.players || []).map(p => ({ id: p.id, score: p.score })))
        .slice().sort((a, b) => b.score - a.score || a.id - b.id);
      const winner = round.winnerId || 0; // 0 — ничья / никто не набрал очков

      const cx = canvas.width / 2;
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px sans-serif";
      ctx.fillText("Раунд окончен", cx, 110);
      ctx.font = "18px sans-serif";
      ctx.fillStyle = winner ? "#ffd54a" : "#bbb";
      ctx.fillText(winner ? `Победитель: игрок ${winner}${winner === wel.playerId ? " (вы)" : ""}` : "Ничья", cx, 142);

      const rowH = 30, w = 280, x0 = cx - w / 2;
      let y = 180;
      ctx.font = "14px monospace";
      ctx.fillStyle = "#888";
      ctx.textAlign = "left";  ctx.fillText("#  игрок", x0 + 12, y);
      ctx.textAlign = "right"; ctx.fillText("счёт", x0 + w - 12, y);
      y += 12;
      rows.forEach((r, i) => {
        const isWinner = r.id === winner, isMe = r.id === wel.playerId;
        ctx.fillStyle = isWinner ? "rgba(255,213,74,0.25)" : i % 2 ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.08)";
        ctx.fillRect(x0, y, w, rowH);
        if (isWinner) { ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y + 1, w - 2, rowH - 2); }
        ctx.font = isWinner ? "bold 16px monospace" : "16px monospace";
        ctx.fillStyle = isWinner ? "#ffd54a" : isMe ? "#7ddc81" : "#e8e8e8";
        ctx.textAlign = "left";
        ctx.fillText(`${i + 1}  ${r.id}${isMe ? " (вы)" : ""}${isWinner ? "  ★" : ""}`, x0 + 12, y + 21);
        ctx.textAlign = "right";
        ctx.fillText(String(r.score), x0 + w - 12, y + 21);
        y += rowH;
      });

      ctx.textAlign = "center";
      ctx.font = "16px sans-serif";
      ctx.fillStyle = "#ccc";
      ctx.fillText(`Следующий раунд через ${Math.max(0, Math.ceil(round.timeLeft))} с`, cx, y + 40);
    }

    function draw(now) {
      net.update(now);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const snap = net.latest;
      const wel = net.welcome;

      if (wel) R = wel.radius;
      if (wel) ctx.setTransform(canvas.width / wel.width, 0, 0, canvas.height / wel.height, 0, 0);

      if (wel) drawObstacles(wel); // под пулями и игроками

      if (snap && wel) {
        drawBullets(now);

        // Игроки
        for (let p of renderPlayers(now, snap)) {
          const mine = p.id === wel.playerId;
          // Своего игрока рисуем по предсказанию (без задержки), остальных — интерполированными.
          if (mine && net.predictionReady()) {
            const rp = net.renderPos();
            p = { ...p, x: rp.x, y: rp.y, angle: net.myAngle() };
          }
          const flashed = now - (flashAt.get(p.id) ?? -Infinity) < FLASH_MS;
          ctx.fillStyle = flashed ? "#ffffff" : mine ? "#4caf50" : "#e05555";
          ctx.beginPath();
          ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + Math.cos(p.angle) * AIM_LEN, p.y + Math.sin(p.angle) * AIM_LEN);
          ctx.stroke();

          // hp = 0 и score = 0 — валидные значения, поэтому проверяем именно на undefined/null.
          if (p.hp != null && p.score != null) {
            ctx.fillStyle = "#ddd";
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${p.hp} · ${p.score}`, p.x, p.y - R - 6);
          }
        }

        drawHits(now); // поверх игроков, чтобы кольцо было видно
      }

      // HUD
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#aaa";
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      const interp = !interpOn ? "interp OFF" : interpOk ? `interp ON ${RENDER_DELAY}ms` : "interp ON (нет пары)";
      ctx.fillText(`${net.status}${snap ? "  tick " + snap.tick : ""}  ${interp}  [I]  pending ${net.pendingCount()}`, 8, 16);

      const round = snap && snap.round;
      if (round && wel) {
        if (round.phase === "play") {
          drawRoundTimer(round);
          drawCrosshair(snap, wel, canvas.width / wel.width, canvas.height / wel.height);
        } else if (round.phase === "intermission") {
          drawIntermission(round, snap, wel);
        }
      } else if (snap && wel) {
        drawCrosshair(snap, wel, canvas.width / wel.width, canvas.height / wel.height); // старый сервер без раундов
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
